kind: 'Added'
body: 'added a `Ticket Reference` section to `Git Flow` making the ticket ID mandatory in branch names and commit scopes, and enumerating the three changes exempt from it because no human opens a ticket for them: dependency upgrades from [autoupdate](https://github.com/rios0rios0/autoupdate) (`chore/autoupdate-YYYY-MM-DD`, `chore(deps)`), release bumps from [autobump](https://github.com/rios0rios0/autobump) (`chore/bump-x.y.z`, `chore(bump)`), and configuration and documentation refreshes from [config-automation](https://github.com/rios0rios0/config-automation) (`chore/config-and-docs-refresh`, `chore(refresh)`). The exemption follows the change rather than the author, waives only the ticket, and is mirrored in the `git-workflow` agent and the `CONTRIBUTING` template.'
