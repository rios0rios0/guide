kind: 'Changed'
body: 'changed the changelog standard to apply chlog **when the project uses it** rather than unconditionally: `Documentation & Change Control` now documents both modes side by side -- a chlog project writes a fragment under `.changes/unreleased/`, a project without it edits `[Unreleased]` in `CHANGELOG.md` by hand -- with a detection table (`.chlog.yaml`/`.chlog.yml`/`.changes/`) matching the one the shared pipelines basic-checks gate uses, shared writing rules, and an adoption checklist. `CHANGELOG Formatting`, the `CONTRIBUTING` template, `Git Flow`, the `changelog-enforcer` and `git-workflow` agents, `fix-ci`, `fix-guardrails`, and the `changelog-guard` hook all branch the same way, so a repository that has not adopted chlog is no longer told to run a tool it does not have.'
