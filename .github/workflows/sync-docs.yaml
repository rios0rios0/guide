name: 'Sync Docs'

on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'

jobs:
  check:
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Check TOC Sync'
        run: 'bash .github/workflows/sync-docs/check-toc-sync.sh'
